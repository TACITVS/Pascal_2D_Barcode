name: Frozen registered reliability validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [binary128, gray128, qrl128, dm128, binary800, gray800, qrl800, dm800, qrm128, qrq128, qrh128, qrm800, qrq800, qrh800]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen experiment dependencies
        run: >-
          python -m pip install -e ".[dev,bench]"
          "numpy==2.5.4" "scipy==1.18.1"
          "opencv-python-headless==5.0.0.93"
          "segno==1.6.6" "zxing-cpp==3.1.1"
      - name: Statistical checks
        run: python -m pytest research/density/test_validate_reliable.py -q
      - name: Confirm frozen point on fresh trials
        run: >-
          python research/density/validate_reliable.py
          --plan research/density/reliable_validation_plan.json
          --group ${{ matrix.group }}
          --out results/confirm-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirm-${{ matrix.group }}
          path: results/
