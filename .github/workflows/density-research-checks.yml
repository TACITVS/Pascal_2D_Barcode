name: Density receiver research checks

on:
  pull_request:
    paths:
      - "research/density/**"
      - ".github/workflows/density-research-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,bench]" "zxing-cpp==3.1.1"
      - name: Decoder, baseline and statistics checks
        run: >-
          python -m pytest
          research/density/test_soft_outer.py
          research/density/test_reliable_density.py
          research/density/test_shaped_gray.py
          research/density/test_standard_assist.py
          research/density/test_validate_reliable.py -q
