name: equal compression comparison

on:
  pull_request:
    paths:
      - "research/density/compression_compare.py"
      - "research/density/test_compression_compare.py"
      - ".github/workflows/compression-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install comparison dependencies
        run: python -m pip install -e ".[dev,bench]" "zxing-cpp>=3.0,<4" brotli zstandard
      - name: Compression integrity regression checks
        run: python -m pytest research/density/test_compression_compare.py -q
      - name: Identical payload comparison
        run: python research/density/compression_compare.py --out comparison-results/compression-comparison.json
      - name: Publish downloadable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equal-compression-comparison
          path: comparison-results/
          if-no-files-found: warn
