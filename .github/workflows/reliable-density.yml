name: Public-pilot assisted density discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - payload: 128
            widths: "60,64,66,68,72,76,80"
            profiles: "turbo/0.55,qr/L,qr/M,qr/Q,qr/H,datamatrix/ECC200,shaped/0.85+0.35+0.18,shaped/0.85+0.55+0.25"
          - payload: 800
            widths: "120,128,136,144,152,160,168,176"
            profiles: "turbo/0.85,qr/L,qr/M,qr/Q,qr/H,datamatrix/ECC200,shaped/0.85+0.35+0.18,shaped/0.85+0.55+0.25"
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install -e ".[dev,bench]" "zxing-cpp>=3,<4"
      - name: Decoder and comparison checks
        run: python -m pytest research/density/test_soft_outer.py research/density/test_reliable_density.py research/density/test_shaped_gray.py research/density/test_standard_assist.py -q
      - name: Run paired discovery trials
        run: >-
          python research/density/reliable_density.py
          --payload ${{ matrix.payload }}
          --widths "${{ matrix.widths }}"
          --profiles "${{ matrix.profiles }}"
          --trials 16 --seed 20261022
          --out results/reliable-${{ matrix.payload }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registered-density-${{ matrix.payload }}
          path: results/
