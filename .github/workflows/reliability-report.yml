name: Audit reliable density results and figures

on:
  pull_request:
    paths:
      - "research/density/reliable_confirm_*.json"
      - "research/density/summarize_reliable.py"
      - ".github/workflows/reliability-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen experiment and plotting dependencies
        run: >-
          python -m pip install -e ".[dev,bench]"
          "numpy==2.5.4" "scipy==1.18.1"
          "opencv-python-headless==5.0.0.93"
          "segno==1.6.6" "zxing-cpp==3.1.1" "matplotlib>=3.10,<4"
      - name: Audit per-trial counts, confidence accounting and figures
        run: python research/density/summarize_reliable.py --emit-svg
      - uses: actions/upload-artifact@v4
        with:
          name: reliable-density-report
          path: |
            research/density/reliable_combined_results.json
            research/density/reliable_density_results.svg
            research/density/reliable_800_patterns.svg
